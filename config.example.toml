[network]
# default = "prompt" # allow | deny | prompt
# allow = ["token-plan-cn.xiaomimimo.com", "github.com", ".githubusercontent.com"]
# deny = []
# audit = true

[tui]
alternate_screen = "auto" # auto | always | never
mouse_capture = true

[features]
shell_tool = true
subagents = true
web_search = true
apply_patch = true
mcp = true
exec_policy = true

[retry]
enabled = true
max_retries = 3
initial_delay = 1.0
max_delay = 60.0
exponential_base = 2.0

[context]
enabled = false
verbatim_window_turns = 16
l1_threshold = 192000
l2_threshold = 384000
l3_threshold = 576000
cycle_threshold = 768000
seam_model = "mimo-v2-flash"

[capacity]
enabled = false
low_risk_max = 0.50
medium_risk_max = 0.62
severe_min_slack = -0.25
severe_violation_ratio = 0.40
refresh_cooldown_turns = 6
replan_cooldown_turns = 5
max_replay_per_turn = 1
min_turns_before_guardrail = 4
profile_window = 8
xiaomimimo_v4_pro_prior = 3.5    # internal key for mimo-v2.5-pro / mimo-v2.5 / mimo-v2-pro
xiaomimimo_v4_flash_prior = 4.2  # internal key for mimo-v2-flash
fallback_default_prior = 3.8

[profiles.work]
api_key = "WORK_XIAOMIMIMO_API_KEY"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
default_text_model = "mimo-v2.5-pro"

[profiles.dev]
api_key = "DEV_XIAOMIMIMO_API_KEY"
allow_shell = true

[notifications]
# method = "auto" # auto | osc9 | bel | off
# threshold_secs = 30
# include_summary = false
