# XiaomiMiMo-TUI Configuration
# Unofficial CLI for Xiaomi MiMo Platform.
# See docs/CONFIGURATION.md for full config-loading behavior.

# Active provider and Xiaomi MiMo defaults.
provider = "xiaomimimo" # xiaomimimo | nvidia-nim | openrouter | novita | fireworks | sglang
api_key = "YOUR_XIAOMIMIMO_API_KEY" # or set XIAOMIMIMO_API_KEY
base_url = "https://token-plan-cn.xiaomimimo.com/v1" # Token Plan package dedicated OpenAI-compatible Base URL
# Anthropic-compatible base URL, for external Anthropic SDK/proxy use:
# Token Plan package dedicated Anthropic-compatible Base URL: https://token-plan-cn.xiaomimimo.com/anthropic
default_text_model = "mimo-v2.5-pro"

# Xiaomi MiMo thinking toggle.
# "off" sends thinking.type = disabled; any other value sends thinking.type = enabled.
reasoning_effort = "max"

# Paths.
skills_dir = "~/.xiaomimimo/skills"
mcp_config_path = "~/.xiaomimimo/mcp.json"
notes_path = "~/.xiaomimimo/notes.txt"
memory_path = "~/.xiaomimimo/memory.md"

# Agent safety defaults.
allow_shell = true
approval_policy = "on-request" # on-request | untrusted | never
sandbox_mode = "workspace-write" # read-only | workspace-write | danger-full-access | external-sandbox
max_subagents = 5

# Provider credentials. Env vars override this file.
# XiaomiMiMo: XIAOMIMIMO_API_KEY, XIAOMIMIMO_BASE_URL, XIAOMIMIMO_MODEL
# NIM:        NVIDIA_API_KEY or NVIDIA_NIM_API_KEY, NVIDIA_NIM_BASE_URL, NVIDIA_NIM_MODEL
# OpenRouter: OPENROUTER_API_KEY, OPENROUTER_BASE_URL
# Novita:     NOVITA_API_KEY, NOVITA_BASE_URL
# Fireworks:  FIREWORKS_API_KEY, FIREWORKS_BASE_URL
# SGLang:     SGLANG_BASE_URL, SGLANG_MODEL, optional SGLANG_API_KEY

[providers.xiaomimimo]
# api_key = "YOUR_XIAOMIMIMO_API_KEY"
# base_url = "https://token-plan-cn.xiaomimimo.com/v1"
# model = "mimo-v2.5-pro" # also: mimo-v2.5, mimo-v2-pro, mimo-v2-omni, mimo-v2-flash, mimo-v2-tts, mimo-v2.5-tts*

[providers.nvidia_nim]
# api_key = "YOUR_NVIDIA_API_KEY"
# base_url = "https://integrate.api.nvidia.com/v1"
# model = "mimo-v2.5-pro"

[providers.openrouter]
# api_key = "YOUR_OPENROUTER_API_KEY"
# base_url = "https://openrouter.ai/api/v1"
# model = "mimo-v2.5-pro"

[providers.novita]
# api_key = "YOUR_NOVITA_API_KEY"
# base_url = "https://api.novita.ai/v1"
# model = "mimo-v2.5-pro"

[providers.fireworks]
# api_key = "YOUR_FIREWORKS_API_KEY"
# base_url = "https://api.fireworks.ai/inference/v1"
# model = "mimo-v2.5-pro"

[providers.sglang]
# api_key = "OPTIONAL_SGLANG_TOKEN"
# base_url = "http://localhost:30000/v1"
