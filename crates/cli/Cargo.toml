[package]
name = "xiaomimimo-tui-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI facade for XiaomiMiMo chat, workspace flows, and speech synthesis"

[[bin]]
name = "xiaomimimo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
xiaomimimo-agent = { path = "../agent", version = "0.6.5" }
xiaomimimo-app-server = { path = "../app-server", version = "0.6.5" }
xiaomimimo-config = { path = "../config", version = "0.6.5" }
xiaomimimo-execpolicy = { path = "../execpolicy", version = "0.6.5" }
xiaomimimo-mcp = { path = "../mcp", version = "0.6.5" }
xiaomimimo-secrets = { path = "../secrets", version = "0.6.5" }
xiaomimimo-state = { path = "../state", version = "0.6.5" }
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.16"
